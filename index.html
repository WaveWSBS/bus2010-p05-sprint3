<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>IPP Co-op Portal · P05 Opportunity Matcher &amp; AI Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: deep-teal masthead; "My matches" pairs a pinned teal profile panel with one calm list of jobs,
   one bold lime "next step" card, and a side drawer for details. Other views: two quiet columns, extra
   detail folded away.
   Palette (client): cyan #54C0CC, deep teal #1F4F59, olive #7EA00E, lime #DCD964, forest #213502.
   Meaning colours are limited to three, always with an icon and a word:
   green = you can / done, yellow = one thing to do, gray = not now or closed. */
:root {
  --paper: #F5F7EE;
  --raised: #FCFDF8;
  --ink: #213502;
  --ink-2: #4A5A3A;
  --ink-3: #6B775F;
  --rule: #DFE5D3;
  --rule-strong: #C5CEB5;
  --teal: #1F4F59;
  --teal-deep: #183F47;
  --teal-ink: #F1F5E6;
  --teal-ink-2: #B7D0CF;
  --teal-rule: #2E6370;
  --cyan: #54C0CC;
  --lime: #DCD964;
  --lime-ink: #213502;
  --link: #1F4F59;
  --focus: #1F4F59;
  --go: #4E7808; --go-ink: #3D6006; --go-soft: #E3ECC9;
  --todo: #C9B21E; --todo-ink: #5E5300; --todo-soft: #F6F0C2;
  --no: #9AA38F; --no-ink: #5C6853; --no-soft: #E7EBDF;
  --series-1: #1F4F59; --series-2: #54C0CC;
  --dot-off: #D6DDC8;
  --scrim: rgba(16, 24, 10, .55);
  --shadow: 0 18px 50px rgba(20, 33, 6, .18);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-id: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-xl: 30px; --r-lg: 22px; --r-md: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10180A; --raised: #172210; --ink: #EEF2DF; --ink-2: #BAC4A8; --ink-3: #8E9A81;
    --rule: #26341A; --rule-strong: #3A4C2D;
    --teal: #1D4A53; --teal-deep: #163B43; --teal-ink: #EEF4E6; --teal-ink-2: #A9C9CB; --teal-rule: #2C6470;
    --link: #7FD3DC; --focus: #DCD964;
    --go: #6E9A14; --go-ink: #A9CB3E; --go-soft: #1E2D0C;
    --todo: #C9B21E; --todo-ink: #E2DC6E; --todo-soft: #2B290D;
    --no: #56634B; --no-ink: #A2AD95; --no-soft: #1C2616;
    --series-1: #2C7887; --series-2: #54C0CC;
    --dot-off: #2E3D22;
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 18px 50px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10180A; --raised: #172210; --ink: #EEF2DF; --ink-2: #BAC4A8; --ink-3: #8E9A81;
  --rule: #26341A; --rule-strong: #3A4C2D;
  --teal: #1D4A53; --teal-deep: #163B43; --teal-ink: #EEF4E6; --teal-ink-2: #A9C9CB; --teal-rule: #2C6470;
  --link: #7FD3DC; --focus: #DCD964;
  --go: #6E9A14; --go-ink: #A9CB3E; --go-soft: #1E2D0C;
  --todo: #C9B21E; --todo-ink: #E2DC6E; --todo-soft: #2B290D;
  --no: #56634B; --no-ink: #A2AD95; --no-soft: #1C2616;
  --series-1: #2C7887; --series-2: #54C0CC;
  --dot-off: #2E3D22;
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.1; font-weight: 650; }
h1 { font-size: clamp(32px, 4.2vw, 46px); letter-spacing: -.02em; }
h2 { font-size: 24px; letter-spacing: -.01em; }
h3 { font-size: 20px; }
p { margin: 0; }
.id { font-family: var(--font-id); font-size: .84em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--ink-3); }
.small { font-size: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- masthead ---------- */
.mast { background: linear-gradient(135deg, #0E3B43 0%, #0F766E 100%); color: var(--teal-ink); border-radius: 0 0 var(--r-xl) var(--r-xl); }
:root[data-theme="dark"] .mast { background: linear-gradient(135deg, #0B2D34 0%, #0D5651 100%); }
.mast-row { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; padding-block: 20px 16px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark { width: 46px; height: 46px; border-radius: 16px; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.02em; flex: none; }
.brand-name { font-family: var(--font-display); font-size: 23px; font-weight: 650; line-height: 1.05; }
.brand-sub { font-size: 13px; color: var(--teal-ink-2); margin-top: 2px; }
.nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; background: rgba(11, 45, 52, .62); padding: 5px; border-radius: 999px; }
.tab { appearance: none; border: 0; background: transparent; color: var(--teal-ink); padding: 9px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.tab:hover { background: rgba(255, 255, 255, .1); }
.tab[aria-selected="true"] { background: var(--lime); color: var(--lime-ink); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool { appearance: none; border: 0; background: rgba(11, 45, 52, .62); color: var(--teal-ink); height: 42px; min-width: 42px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.tool:hover { background: var(--teal-rule); }
.tool-accent { background: #F2B134; color: #1F2933; }
.tool-accent:hover { background: #F6C561; }

/* ---------- unified IPP journey ribbon ---------- */
.ipp-ribbon { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 0 0 18px; }
@media (max-width: 1020px) { .ipp-ribbon { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 600px) { .ipp-ribbon { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ipp-step { appearance: none; border: 1px solid rgba(255, 255, 255, .16); background: rgba(11, 45, 52, .46); color: var(--teal-ink); border-radius: 14px; padding: 8px 11px; text-align: left; cursor: pointer; display: grid; gap: 3px; transition: background .15s ease, border-color .15s ease; }
.ipp-step:hover { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .34); }
.ipp-step.active { background: rgba(220, 217, 100, .18); border-color: var(--lime); }
.ipp-step-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--teal-ink-2); }
.ipp-step.active .ipp-step-top { color: var(--lime); }
.ipp-step-name { font-size: 13px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ipp-pill { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: rgba(255, 255, 255, .14); color: #fff; }
.ipp-pill--live { background: var(--lime); color: var(--lime-ink); }
.ipp-pill--sim { background: rgba(242, 177, 52, .25); color: #FDE68A; }

main { padding-block: 40px 80px; }

/* ---------- the three meanings ---------- */
.v { display: inline-flex; align-items: center; gap: 8px; padding: 5px 13px 5px 6px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; }
.v i, .ic { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 800; flex: none; line-height: 1; }
.v--go { background: var(--go-soft); color: var(--go-ink); }
.v--todo { background: var(--todo-soft); color: var(--todo-ink); }
.v--no { background: var(--no-soft); color: var(--no-ink); }
.v--go i, .ic--go { background: var(--go); color: #fff; }
.v--todo i, .ic--todo { background: var(--todo); color: #2B2600; }
.v--no i, .ic--no { background: var(--no); color: var(--paper); }
.ic--off { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--rule-strong); }
.fill--go { background: var(--go); }
.fill--todo { background: var(--todo); }
.fill--no { background: var(--no); }
.fill--s1 { background: var(--series-1); }
.fill--s2 { background: var(--series-2); }

/* ---------- controls ---------- */
.btn { appearance: none; border: 0; background: var(--teal); color: var(--teal-ink); padding: 10px 20px; border-radius: 999px; font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--teal-deep); }
.btn-dark { background: var(--lime-ink); color: var(--lime); }
.btn-dark:hover { background: #2E4A04; }
.btn-quiet { appearance: none; background: transparent; border: 0; box-shadow: inset 0 0 0 1.5px var(--rule-strong); color: var(--ink); padding: 9px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-quiet:hover { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.btn-sm { padding: 6px 14px; font-size: 14px; }
.btn-link { appearance: none; border: 0; background: none; color: var(--link); padding: 0; cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.btn-danger { background: #8A3B22; color: #fff; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--rule-strong); flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: none; padding: 7px 15px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
label { display: block; font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
select, input[type="text"], input[type="date"], input[type="search"], input[type="password"], textarea { width: 100%; background: var(--raised); border: 0; box-shadow: inset 0 0 0 1.5px var(--rule-strong); border-radius: var(--r-md); padding: 10px 14px; font-size: 15px; }
textarea { min-height: 88px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
details.fold { border-top: 1px solid var(--rule); padding-block: 4px; }
details.fold > summary { cursor: pointer; list-style: none; padding-block: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "+"; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--rule-strong); font-weight: 700; flex: none; }
details.fold[open] > summary::before { content: "–"; }
details.fold > summary .muted { font-weight: 400; font-size: 14px; }
.fold-body { padding-bottom: 20px; display: grid; gap: 14px; }

/* ---------- page furniture ---------- */
.page-head { display: grid; gap: 12px; padding-bottom: 30px; }
.page-head p { color: var(--ink-2); max-width: 62ch; font-size: 17px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 64px; align-items: start; }
@media (max-width: 960px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.sec { padding-block: 30px; border-top: 1px solid var(--rule); display: grid; gap: 18px; min-width: 0; }
.col > .sec:first-child { border-top: 1.5px solid var(--ink); }
.sec-head { display: grid; gap: 6px; }
.sec-head p { color: var(--ink-3); font-size: 15px; max-width: 60ch; }
.empty { color: var(--ink-3); font-size: 15px; padding: 20px 22px; border-radius: var(--r-lg); background: var(--raised); box-shadow: inset 0 0 0 1px var(--rule); }
.note { display: block; margin-top: 6px; font-size: 14px; background: var(--todo-soft); color: var(--ink); border-radius: 12px; padding: 8px 12px; }
pre.json { margin: 0; background: var(--raised); box-shadow: inset 0 0 0 1px var(--rule); border-radius: var(--r-lg); padding: 16px 18px; font-family: var(--font-id); font-size: 12px; line-height: 1.5; overflow: auto; max-height: 300px; }
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 13px; padding: 0 12px 10px 0; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
.tbl td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.key { width: 12px; height: 12px; border-radius: 4px; display: inline-block; flex: none; }
#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1.4; padding: 8px 12px; border-radius: 12px; max-width: 280px; box-shadow: var(--shadow); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 12px 22px; border-radius: 999px; font-size: 15px; max-width: min(560px, calc(100% - 32px)); z-index: 70; box-shadow: var(--shadow); }

/* ---------- My matches ---------- */
.matches { display: grid; grid-template-columns: minmax(270px, 330px) minmax(0, 1fr); gap: 56px; align-items: start; }
@media (max-width: 960px) { .matches { grid-template-columns: minmax(0, 1fr); gap: 32px; } }
.panel { background: var(--teal); color: var(--teal-ink); border-radius: var(--r-xl); padding: 26px; display: grid; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--teal-rule) transparent; }
@media (max-width: 960px) { .panel { position: static; max-height: none; order: 2; } }
.p-sec { padding-block: 20px; border-top: 1px solid var(--teal-rule); display: grid; gap: 12px; }
.p-sec:first-child { border-top: 0; padding-top: 0; }
.p-sec:last-child { padding-bottom: 0; }
.p-label { font-size: 13px; color: var(--teal-ink-2); font-weight: 600; }
.panel select { background: var(--teal-deep); color: var(--teal-ink); box-shadow: inset 0 0 0 1.5px var(--teal-rule); border-radius: 999px; }
.panel input[type="search"] { background: var(--teal-deep); color: var(--teal-ink); box-shadow: inset 0 0 0 1.5px var(--teal-rule); border-radius: 999px; }
.panel input[type="search"]::placeholder { color: var(--teal-ink-2); }
.panel .chip { color: var(--teal-ink); box-shadow: inset 0 0 0 1.5px var(--teal-rule); }
.panel .chip[aria-pressed="true"] { background: var(--lime); color: var(--lime-ink); box-shadow: none; }
.panel label .muted { color: var(--teal-ink-2); }
.panel label { color: var(--teal-ink-2); font-size: 13px; }
.who { display: flex; gap: 14px; align-items: center; }
.avatar { width: 56px; height: 56px; border-radius: 20px; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; flex: none; }
.who-name { font-family: var(--font-display); font-size: 23px; font-weight: 650; line-height: 1.1; }
.who-sub { font-size: 13px; color: var(--teal-ink-2); }
.goal { font-family: var(--font-display); font-size: 17px; line-height: 1.4; font-weight: 500; }
.facts { display: grid; gap: 10px; margin: 0; font-size: 15px; }
.facts div { display: grid; gap: 1px; }
.facts dt { font-size: 13px; color: var(--teal-ink-2); }
.facts dd { margin: 0; }
.panel .warn { color: var(--lime); font-weight: 600; }
.skills { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 15px; }
.skills li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 12px; align-items: center; }
.skills .s-sub { grid-column: 2; font-size: 12.5px; color: var(--teal-ink-2); margin-top: -2px; }
.panel .ic--no { background: transparent; color: var(--teal-ink-2); box-shadow: inset 0 0 0 1.5px var(--teal-ink-2); }

.hello { display: grid; gap: 14px; padding-bottom: 28px; }
.hello p { font-size: 18px; color: var(--ink-2); max-width: 46ch; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); }
.count { padding: 22px 20px 22px 0; display: grid; gap: 8px; }
.count + .count { padding-left: 22px; border-left: 1px solid var(--rule); }
.count-num { font-family: var(--font-display); font-size: 52px; font-weight: 650; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.count-label { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
@media (max-width: 560px) { .count-num { font-size: 38px; } .count { padding-right: 8px; } .count + .count { padding-left: 12px; } .count-label { font-size: 13px; } }

.next { margin-top: 30px; background: var(--lime); color: var(--lime-ink); border-radius: var(--r-xl); padding: 28px 30px; display: grid; gap: 14px; }
.next-label { font-size: 14px; font-weight: 700; }
.next h2 { font-size: 27px; max-width: 26ch; }
.next p { max-width: 54ch; color: var(--lime-ink); opacity: .82; }
.next .actions { margin-top: 4px; }
.next--done { background: var(--go-soft); color: var(--ink); }
.next--done p { color: var(--ink-2); opacity: 1; }
.changed { margin-top: 30px; padding: 22px 26px; border-radius: var(--r-xl); background: var(--go-soft); display: grid; gap: 10px; }
.changed ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

.jobs-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-top: 40px; padding-bottom: 12px; }
.jobs { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--ink); }
.job { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 22px; align-items: center; padding-block: 24px; border-bottom: 1px solid var(--rule); }
.job-main { display: grid; gap: 6px; min-width: 0; }
.job-title { font-family: var(--font-display); font-size: 21px; font-weight: 650; line-height: 1.15; }
.job-org { color: var(--ink-3); font-size: 15px; }
.job-line { font-size: 15.5px; color: var(--ink-2); }
.job-side { display: grid; gap: 10px; justify-items: end; }
.job--dim .job-title { color: var(--ink-2); }
.job-verdict { width: 196px; }
@media (max-width: 760px) { .job { grid-template-columns: minmax(0, 1fr); } .job-side { justify-items: start; grid-auto-flow: column; align-items: center; } .job-verdict { width: auto; } }
.fit { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-3); }
.fit span { width: 9px; height: 9px; border-radius: 50%; background: var(--dot-off); }
.fit span.on { background: var(--series-1); }
.fit em { font-style: normal; margin-left: 6px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--paper); z-index: 41; overflow-y: auto; border-radius: var(--r-xl) 0 0 var(--r-xl); box-shadow: var(--shadow); padding: calc(28px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) calc(36px + env(safe-area-inset-bottom, 0px)) 32px; display: grid; gap: 26px; align-content: start; }
@media (max-width: 600px) { .drawer { border-radius: 0; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); } }

<script>

 * mandatory state. When no embedding signal is available it falls back to word

 *

  //   a vocabulary skill is suggested for a phrase when cosine >= suggest_min (top suggest_top only)
  // Set on 2026-11-16 from 67,284 goal x open-listing pairs: median 0.809, 90th percentile 0.844, max 0.933.
  var AI_PARAMS = { floor: 0.82, ceil: 0.90, suggest_min: 0.84, suggest_top: 2, reason_min_fit: 0.5 };

  var DEFAULT_METHODS = [
    {
      method_version: 'rules-1.0.0', family: 'rules', label: 'Rules baseline',
      created_at: '2026-11-04', created_by: 'Team 5', note: 'Initial editable baseline',
      weights: { sector: 2, role: 2, city: 1, desirable_skill: 1 }

    {
      method_version: 'ai-assist-0.1.0', family: 'ai', label: 'AI-assisted (simulated)',
      created_at: '2026-11-06', created_by: 'Team 5',

      weights: { sector: 2, role: 2, city: 1, desirable_skill: 1, goal_text: 2, suggested_skill: 0.5 }
    },
    {
      method_version: 'ai-embed-1.0.0', family: 'ai', label: 'AI similarity (gte-small)',
      created_at: '2026-11-16', created_by: 'Team 5',
      model: AI_MODEL,
      note: 'Sprint 2. Rules baseline plus cosine similarity of sentence embeddings (goal text vs job text; free-text skill vs vocabulary). Pretrained model, not trained by us.',
      weights: { sector: 2, role: 2, city: 1, desirable_skill: 1, goal_semantic: 3, suggested_skill: 0.5 },
      params: AI_PARAMS
    },
    {
      method_version: 'ai-embed-1.1.0', family: 'ai', label: 'AI similarity (gte-small, Sprint 3 synonyms)',
      created_at: '2026-11-23', created_by: 'Team 5',

      weights: { sector: 2, role: 2, city: 1, desirable_skill: 1, goal_semantic: 3, suggested_skill: 0.5 },

  // The ID covers every input version and the method. A record built without the AI
  // signal (fallback) gets a different ID from one built with it, so neither overwrites the other.
  function recordIdFor(rec) {

  function vocabMap(vocab) {

  // ---------- lexical similarity (the simulated "AI" part) ----------
  var STOP = {};
  ('a an and the of for in on to with by at from as is are be this that it into using use build learn how ' +
   'my me i we our your their about across work working role roles data intern help teams team short ' +
   'more make plan').split(' ').forEach(function (w) { STOP[w] = true; });

  function stem(t) {
    if (t.indexOf('analy') === 0) return 'analy';
    if (t.length > 4 && /ies$/.test(t)) return t.slice(0, -3) + 'y';
    if (t.length > 4 && /s$/.test(t) && !/ss$/.test(t)) return t.slice(0, -1);

  function tokenize(text) {
    var out = [], seen = {}, words = (text || '').toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').split(/[\s-]+/);

  function textSimilarity(a, b) {

    var setB = {}; B.stems.forEach(function (s) { setB[s] = true; });

    var score = shared.length / Math.sqrt(A.stems.length * B.stems.length);

  }

  function suggestSkills(phrase, vocab) {
    var P = tokenize(phrase).stems;
    if (!P.length) return [];
    var out = [];
    vocab.forEach(function (v) {
      var T = tokenize(v.label + ' ' + v.synonyms.join(' ')).stems;
      var set = {}; T.forEach(function (s) { set[s] = true; });
      var hit = P.filter(function (s) { return set[s]; }).length;
      var score = Math.round((hit / P.length) * 100) / 100;
      if (score >= 0.5) out.push({ skill_id: v.skill_id, label: v.label, score: score });
    });
    out.sort(function (x, y) { return y.score - x.score || x.skill_id.localeCompare(y.skill_id); });

  }

  // ---------- AI signals (real model outputs, computed elsewhere) ----------
  // data.ai = { model, source, goals: { <textKey(goal)>: { 'OP-028@2': cosine, ... } },
  //             phrases: { '<phrase>': [{ skill_id, score }, ...] } }
  function textKey(text) { return fnv1a(String(text == null ? '' : text)); }

  function aiLookup(ai) {
    if (!ai) return null;
    return {
      model: ai.model || AI_MODEL,
      source: ai.source || 'precomputed',
      hasGoal: function (goal) { return !!(ai.goals && ai.goals[textKey(goal)]); },
      goal: function (goal, opportunity_id, version) {

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }

  // ---------- listing helpers ----------
  function publishedVersion(listing) {
    if (!listing.approved_version) return null;
    var rec = listing.versions[listing.approved_version];
    if (!rec) return null;

  }

  function findSkill(profile, skill_id) {
    var s = (profile.skills || []).filter(function (x) { return x.skill_id === skill_id; })[0];
    if (!s) return null;

  // ---------- the evaluator ----------
  function evaluate(profile, listing, method, vocab, ai) {
    var V = vocabMap(vocab);
    if (ai && typeof ai.goal !== 'function') ai = aiLookup(ai);
    var embed = method.family === 'ai' && !!method.model;
    var params = method.params || AI_PARAMS;
    var usedFallback = false;
    var w = method.weights;
    var pub = publishedVersion(listing);
    var pv = profile.profile_version;

    var rec = {
      student_id: profile.student_id,
      profile_version: pv,
      opportunity_id: listing.opportunity_id,
      opportunity_version: pub ? pub.version : null,
      method_version: method.method_version,
      method_family: method.family,
      listing: null,
      status: null,
      status_reason: '',
      mandatory: [],
      desirable: [],
      interests: [],
      reasons: [],
      gaps: [],
      unknowns: [],
      ai_notes: [],
      ai_source: null,
      pref_points: 0

    if (!pub) {
      rec.status = 'excluded';
      rec.status_reason = 'Not published by P03 (no approved version)';

    }
    var L = pub.record;
    var ov = pub.version;
    rec.listing = {
      title: L.title, employer: L.employer, city: L.city, work_arrangement: L.work_arrangement,
      start_date: L.start_date, end_date: L.end_date, sector: L.sector, role_family: L.role_family

    function cite(profile_field, opportunity_field) {

          });
        }
      });
    }
    function simWord(s) { return s.via === 'embedding' ? 'AI similarity ' + s.score + ', ' + method.model : 'word overlap ' + s.score + ', simulated'; }

    var reasonPool = [];
    var points = 0;

    // Mandatory conditions
    L.mandatory.forEach(function (c, i) {

      if (c.kind === 'skill') {

        out.profile_field = 'skills[' + c.skill_id + ']';
        out.opportunity_field = 'mandatory[' + c.skill_id + ']';

      { kind: 'role', label: 'Role', pval: profile.roles || [], oval: L.role_family, pf: 'roles', of: 'role_family', weight: w.role },
      { kind: 'city', label: 'Location', pval: profile.locations || [], oval: L.city, pf: 'locations', of: 'city', weight: w.city }
    ];
    interests.forEach(function (it) {
      var matched = it.pval.indexOf(it.oval) >= 0;
      rec.interests.push({ kind: it.kind, label: it.label, value: it.oval, matched: matched, profile_field: it.pf, opportunity_field: it.of, known: it.pval.length > 0 });
      if (matched) {
        points += it.weight;
        var text = it.kind === 'sector' ? 'You chose ' + it.oval + ' as a sector; this role is in ' + it.oval
          : it.kind === 'role' ? 'You are looking for ' + it.oval + ' roles; this is one'
          : 'You listed ' + it.oval + ' as a preferred location';
        reasonPool.push({ rank: 2, text: text, c: cite(it.pf, it.of) });
      }
    });

    if (method.family === 'ai') {
      var cos = embed && ai ? ai.goal(profile.goals, listing.opportunity_id, ov) : null;
      var gw = w.goal_semantic != null ? w.goal_semantic : (w.goal_text || 0);
      if (cos != null) {
        var fit = r2(clamp01((cos - params.floor) / (params.ceil - params.floor)));
        var addE = r2(gw * fit);
        points += addE;
        rec.ai_notes.push({ text: 'Goal text and job text are close in meaning: cosine ' + cos + ', fit ' + fit + ' (+' + addE + ' points). Model ' + method.model + ', pretrained, not trained by us.', field: 'goals', kind: 'goal_similarity', score: cos, fit: fit, via: 'embedding' });
        if (fit >= params.reason_min_fit) {
          reasonPool.push({ rank: 5, text: 'Your goals are close in meaning to this job (AI similarity ' + cos + ', ' + method.model + ')', c: cite('goals', 'description') });
        }
      } else {
        if (embed) usedFallback = true;
        var sim = textSimilarity(profile.goals, L.title + ' ' + L.description + ' ' + L.sector);
        if (sim.score > 0) {
          var add = r2(gw * sim.score);
          points += add;
          rec.ai_notes.push({ text: 'Goal text shares terms with the listing: ' + sim.shared.join(', ') + ' (similarity ' + sim.score + ', +' + add + ' points; word overlap, simulated' + (embed ? ' fallback: no AI signal' : '') + ')', field: 'goals', kind: 'goal_similarity', score: sim.score, via: 'lexical' });
          reasonPool.push({ rank: 5, text: 'Your goals mention ' + sim.shared.slice(0, 3).join(', ') + ' (AI-assisted, simulated)', c: cite('goals', 'description') });
        }
      }
      rec.ai_source = !embed ? 'lexical' : (usedFallback ? 'lexical-fallback' : 'embedding');
    }

    rec.pref_points = Math.round(points * 100) / 100;

    reasonPool.sort(function (x, y) { return x.rank - y.rank; });
    rec.reasons = reasonPool.slice(0, 3).map(function (r) {
      var o = { text: r.text };
      Object.keys(r.c).forEach(function (k) { o[k] = r.c[k]; });
      return o;
    });

    var notMet = rec.mandatory.filter(function (c) { return c.state === 'not_met'; });
    var unk = rec.mandatory.filter(function (c) { return c.state === 'cannot_confirm'; });
    if (notMet.length) {
      rec.status = 'not_eligible';
      rec.status_reason = 'Blocked by: ' + notMet.map(function (c) { return c.label; }).join('; ');
    } else if (unk.length) {
      rec.status = 'cannot_confirm';
      rec.status_reason = 'Cannot confirm: ' + unk.map(function (c) { return c.label; }).join('; ');
    } else {
      rec.status = 'eligible';
      rec.status_reason = rec.mandatory.length
        ? 'All ' + rec.mandatory.length + ' mandatory conditions met'
        : 'This listing states no mandatory conditions';
    }
    return rec;
  }

  function rank(records) {
    return records.slice().sort(function (a, b) {
      return STATUS_ORDER[a.status] - STATUS_ORDER[b.status] || b.pref_points - a.pref_points || a.opportunity_id.localeCompare(b.opportunity_id);
    });
  }

  function fingerprint(rec) {
    var c = clone(rec);
    delete c.created_at;
    return JSON.stringify(c);
  }

  function emptyState() {
    return {
      schema: SCHEMA,
      recs: {}, recOrder: [], pointers: {},
      gapEvents: [], evidence: [], challenges: [], notes: [], profileAdds: [],
      employerComments: [], progressLogs: [], chatbotEscalations: [],
      methods: clone(DEFAULT_METHODS),
      current: { rules: 'rules-1.0.0', ai: 'ai-embed-1.0.0' },
      log: []
    };
  }

  // ---------- platform: P05 service layer over fixtures + state ----------
  function createPlatform(data, state) {
    var S = state || emptyState();
    var AI = aiLookup(data.ai);
    // Older saved states (Sprint 1/2) lack Sprint 2/3 keys: backfill safely, keep history.
    if (!S.methods.some(function (m) { return m.method_version === 'ai-embed-1.0.0'; })) {
      S.methods.push(clone(DEFAULT_METHODS[2]));
      S.current.ai = 'ai-embed-1.0.0';
    }
    if (!S.methods.some(function (m) { return m.method_version === 'ai-embed-1.1.0'; }) && DEFAULT_METHODS[3]) {
      S.methods.push(clone(DEFAULT_METHODS[3]));
    }
    S.employerComments = S.employerComments || [];
    S.progressLogs = S.progressLogs || [];
    S.chatbotEscalations = S.chatbotEscalations || [];

    function log(actor, text) {
      S.log.push({ ts: nowIso(), actor: actor, text: text });
      if (S.log.length > 200) S.log.shift();
    }

    function allProfiles() { return data.profiles.concat(S.profileAdds); }

    function profileVersions(student_id) {
      return allProfiles().filter(function (p) { return p.student_id === student_id; })
        .sort(function (a, b) { return a.profile_version - b.profile_version; });
    }

    function currentProfile(student_id) {
      var v = profileVersions(student_id);
      return v[v.length - 1];
    }

    function profileAt(student_id, version) {
      return profileVersions(student_id).filter(function (p) { return p.profile_version === version; })[0];
    }

    function students() {
      var seen = {}, out = [];
      allProfiles().forEach(function (p) {
        if (!seen[p.student_id]) { seen[p.student_id] = true; out.push({ student_id: p.student_id, name: p.name }); }
      });
      return out.sort(function (a, b) { return a.student_id.localeCompare(b.student_id); });
    }

    function method(version) { return S.methods.filter(function (m) { return m.method_version === version; })[0]; }
    function currentMethod(family) { return method(S.current[family]); }

    function saveRecommendation(rec) {
      var id = rec.recommendation_id;
      var ex = S.recs[id];
      if (ex) {
        if (fingerprint(ex) !== fingerprint(rec)) throw new Error('Immutable record conflict: ' + id + ' already exists with different content');
        return { record: ex, created: false };
      }
      S.recs[id] = rec;
      S.recOrder.push(id);
      return { record: rec, created: true };
    }

    function pointerKey(student_id, opportunity_id, method_version) { return student_id + '|' + opportunity_id + '|' + method_version; }

    function build(profile, listing, m) {
      var rec = evaluate(profile, listing, m, data.vocabulary, AI);
      rec.recommendation_id = recordIdFor(rec);
      rec.created_at = nowIso();
      var saved = saveRecommendation(rec);
      S.pointers[pointerKey(profile.student_id, listing.opportunity_id, m.method_version)] = saved.record.recommendation_id;
      return saved.record;
    }

    function computeAtVersion(student_id, version, family) {
      var p = profileAt(student_id, version);
      var m = currentMethod(family);
      return rank(data.listings.map(function (L) { return build(p, L, m); }));
    }

    // Current set: the record each pointer names, computing only where none exists.
    function computeSet(student_id, family) {
      var p = currentProfile(student_id);
      var m = currentMethod(family);
      var signal = !!(m.model && AI && AI.hasGoal(p.goals));
      var records = data.listings.map(function (L) {
        var id = S.pointers[pointerKey(student_id, L.opportunity_id, m.method_version)];
        var cached = id && S.recs[id];
        // A fallback record is replaced once the AI signal has arrived (the old one is kept).
        if (cached && !(signal && cached.ai_source === 'lexical-fallback')) return cached;
        return build(p, L, m);
      });
      var stale = records.some(function (r) { return r.profile_version < p.profile_version; });
      return { records: rank(records), profile: p, method: m, stale: stale };
    }

    function recompute(student_id, family, actor) {
      var before = computeSet(student_id, family).records;
      var p = currentProfile(student_id);
      var m = currentMethod(family);
      var after = rank(data.listings.map(function (L) { return build(p, L, m); }));
      var diff = after.map(function (r, i) {
        var bIndex = -1;
        before.forEach(function (b, j) { if (b.opportunity_id === r.opportunity_id) bIndex = j; });
        var b = before[bIndex];
        return {
          opportunity_id: r.opportunity_id,
          title: r.listing ? r.listing.title : r.opportunity_id,
          before: { recommendation_id: b.recommendation_id, status: b.status, rank: bIndex + 1, profile_version: b.profile_version },
          after: { recommendation_id: r.recommendation_id, status: r.status, rank: i + 1, profile_version: r.profile_version },
          changed: b.recommendation_id !== r.recommendation_id
        };
      });
      log(actor || 'P05', 'Recomputed ' + student_id + ' with profile v' + p.profile_version + ' and ' + m.method_version);
      return { records: after, diff: diff, profile: p, method: m };
    }

    function sendGap(recommendation_id, skill_id, actor) {
      var rec = S.recs[recommendation_id];
      if (!rec) throw new Error('Unknown recommendation ' + recommendation_id);
      var gap = rec.gaps.filter(function (g) { return g.skill_id === skill_id; })[0];
      if (!gap) throw new Error(skill_id + ' is not a gap on ' + recommendation_id);
      var existing = S.gapEvents.filter(function (e) { return e.student_id === rec.student_id && e.skill_id === skill_id && e.recommendation_id === recommendation_id; })[0];
      if (existing) return { event: existing, created: false };
      var ev = {
        event_id: 'GAP-' + pad(S.gapEvents.length + 1, 4),
        student_id: rec.student_id,
        skill_id: skill_id,
        opportunity_id: rec.opportunity_id,
        recommendation_id: recommendation_id,
        requirement: gap.requirement,
        current_source: gap.current_source,
        timestamp: nowIso(),
        sent_to: 'P06 Internship Preparation',
        status: 'sent'
      };
      S.gapEvents.push(ev);
      log(actor || rec.student_id, 'Sent ' + skill_id + ' gap to P06 (' + ev.event_id + ')');
      return { event: ev, created: true };
    }

    function publishProfileVersion(student_id, mutate, change_note, actor) {
      var cur = currentProfile(student_id);
      var next = clone(cur);
      next.profile_version = cur.profile_version + 1;
      next.published_at = today();
      next.change_note = change_note;
      mutate(next);
      S.profileAdds.push(next);
      log(actor || 'P01 (simulated)', 'Published ' + student_id + ' profile v' + next.profile_version + ': ' + change_note);
      return next;
    }

    function recordEvidence(event_id, opts) {
      var ev = S.gapEvents.filter(function (e) { return e.event_id === event_id; })[0];
      if (!ev) throw new Error('Unknown gap event ' + event_id);
      var evidence = {
        evidence_id: opts.evidence_id || ('E-' + ev.skill_id.slice(3)),
        student_id: ev.student_id,
        skill_id: ev.skill_id,
        activity: opts.activity || 'P06 practice task for ' + ev.skill_id,
        outcome: opts.outcome,
        reviewer: opts.reviewer,
        review_date: opts.review_date || today(),
        source_event: event_id
      };
      S.evidence.push(evidence);
      ev.status = opts.outcome === 'demonstrated' ? 'reviewed' : 'revision_requested';
      log(opts.reviewer + ' (P06, simulated)', 'Recorded ' + evidence.evidence_id + ' for ' + ev.student_id + ': ' + opts.outcome);
      var newProfile = null;
      if (opts.outcome === 'demonstrated') {
        newProfile = publishProfileVersion(ev.student_id, function (p) {
          var found = false;
          p.skills = p.skills.map(function (s) {
            if (s.skill_id !== ev.skill_id) return s;
            found = true;
            return { skill_id: s.skill_id, source: 'reviewed', evidence_id: evidence.evidence_id, review_date: evidence.review_date };
          });
          if (!found) p.skills.push({ skill_id: ev.skill_id, source: 'reviewed', evidence_id: evidence.evidence_id, review_date: evidence.review_date });
        }, 'Accepted reviewed evidence ' + evidence.evidence_id + ' from P06', 'P01 (simulated)');
      }
      return { evidence: evidence, profile: newProfile };
    }

    function addChallenge(recommendation_id, text, actor) {
      var rec = S.recs[recommendation_id];
      if (!rec) throw new Error('Unknown recommendation ' + recommendation_id);
      var ch = {
        challenge_id: 'CH-' + pad(S.challenges.length + 1, 3),
        recommendation_id: recommendation_id, student_id: rec.student_id, opportunity_id: rec.opportunity_id,
        text: text, actor: actor || rec.student_id, timestamp: nowIso(), status: 'open', response: null
      };
      S.challenges.push(ch);
      log(ch.actor, 'Challenged ' + recommendation_id + ' (' + ch.challenge_id + ')');
      return ch;
    }

    function resolveChallenge(challenge_id, response, actor) {
      var ch = S.challenges.filter(function (c) { return c.challenge_id === challenge_id; })[0];
      if (!ch) throw new Error('Unknown challenge ' + challenge_id);
      ch.status = 'reviewed';
      ch.response = { text: response, actor: actor, timestamp: nowIso() };
      log(actor, 'Reviewed ' + challenge_id);
      return ch;
    }

    // A correction note is stored against the P01 field. P05 never edits P01's record.
    function addNote(recommendation_id, field, text, actor) {
      var rec = S.recs[recommendation_id];
      if (!rec) throw new Error('Unknown recommendation ' + recommendation_id);
      var note = {
        note_id: 'CN-' + pad(S.notes.length + 1, 3),
        student_id: rec.student_id, field: field, profile_version: rec.profile_version,
        recommendation_id: recommendation_id, text: text, actor: actor, timestamp: nowIso(), owner: 'P01'
      };
      S.notes.push(note);
      log(actor, 'Correction note ' + note.note_id + ' on ' + rec.student_id + ' ' + field + ' (P01 record unchanged)');
      return note;
    }

    function notesFor(student_id, field) {
      return S.notes.filter(function (n) { return n.student_id === student_id && (!field || n.field === field); });
    }

    function bump(version) {
      var m = version.match(/^(.*)-(\d+)\.(\d+)\.(\d+)$/);
      var family = m[1];
      var minor = 0;
      S.methods.forEach(function (x) {
        var mm = x.method_version.match(/^(.*)-(\d+)\.(\d+)\.(\d+)$/);
        if (mm && mm[1] === family && mm[2] === m[2]) minor = Math.max(minor, +mm[3]);
      });
      return family + '-' + m[2] + '.' + (minor + 1) + '.0';
    }

    function updateWeights(family, weights, actor, note) {
      var cur = currentMethod(family);
      var next = clone(cur);
      next.method_version = bump(cur.method_version);
      next.weights = weights;
      next.created_at = today();
      next.created_by = actor;
      next.note = note || 'Weights changed';
      S.methods.push(next);
      S.current[family] = next.method_version;
      log(actor, 'Created ' + next.method_version + ' (previous ' + cur.method_version + ' retained)');
      return next;
    }

    function historyFor(student_id, opportunity_id) {
      return S.recOrder.map(function (id) { return S.recs[id]; })
        .filter(function (r) { return r.student_id === student_id && r.opportunity_id === opportunity_id; });
    }

    function addChatbotEscalation(opts) {
      var escItem = {
        escalation_id: 'ESC-' + pad(S.chatbotEscalations.length + 1, 3),
        student_id: opts.student_id || null,
        question: String(opts.question || '').trim(),
        reason: String(opts.reason || '').trim(),
        target: opts.target || 'Co-op Office / Academic Coordinator',
        status: 'open',
        created_at: nowIso()
      };
      S.chatbotEscalations.push(escItem);
      log(opts.student_id || 'Student', 'Escalated assistant question ' + escItem.escalation_id + ' to ' + escItem.target);
      return escItem;
    }

    function addEmployerComment(opts) {
      var txt = String(opts.comment || '').trim();
      var sup = String(opts.supervisor || '').trim();
      if (!txt || !sup) throw new Error('Supervisor name and employer comment are required.');
      var item = {
        comment_id: 'EC-' + pad(S.employerComments.length + 1, 3),
        placement_id: opts.placement_id || 'EG-DXB-028',
        student_id: opts.student_id || 'COOP-B001',
        opportunity_id: opts.opportunity_id || 'OP-028',
        supervisor: sup,
        comment: txt,
        created_at: nowIso(),
        simulated: true
      };
      S.employerComments.push(item);
      log(sup + ' (P02/P03 simulated)', 'Added employer comment ' + item.comment_id + ' for ' + item.student_id);
      return item;
    }

    function addProgressReport(opts) {
      var entry = String(opts.entry || '').trim();
      if (!entry) throw new Error('Progress report summary is required.');
      var item = {
        log_id: 'LOG-' + pad(S.progressLogs.length + 1, 4),
        placement_id: opts.placement_id || 'EG-DXB-028',
        student_id: opts.student_id || 'COOP-B001',
        opportunity_id: opts.opportunity_id || 'OP-028',
        period: opts.period || '2027 week 2',
        goal_id: opts.goal_id || 'G-1',
        entry: entry,
        evidence_ids: Array.isArray(opts.evidence_ids) ? opts.evidence_ids : [],
        review_status: 'submitted',
        feedback: null,
        grade: null,
        grader: null,
        graded_at: null,
        graded_by_human: false,
        ai_graded: false,
        created_at: nowIso(),
        simulated: true
      };
      S.progressLogs.push(item);
      log(item.student_id + ' (P07 simulated)', 'Submitted progress report ' + item.log_id + ' (' + item.period + ')');
      return item;
    }

    function gradeProgressReport(log_id, opts) {
      var item = S.progressLogs.filter(function (l) { return l.log_id === log_id; })[0];
      if (!item) throw new Error('Unknown progress report ' + log_id);
      var grader = String(opts.grader || '').trim();
      var grade = String(opts.grade || '').trim();
      if (!grader || !grade) throw new Error('Faculty approver name and grade are required.');
      item.feedback = String(opts.feedback || '').trim() || 'Reviewed by faculty.';
      item.grade = grade;
      item.grader = grader;
      item.graded_at = nowIso();
      item.graded_by_human = true;
      item.ai_graded = false;
      item.review_status = grade === 'Revision Requested' ? 'revision_requested' : 'reviewed';
      log(grader + ' (Faculty P07 simulated)', 'Graded ' + item.log_id + ': ' + grade);
      return item;
    }

    function isCurrent(rec) {
      return S.pointers[pointerKey(rec.student_id, rec.opportunity_id, rec.method_version)] === rec.recommendation_id;
    }

    return {
      state: S,
      data: data,
      students: students,
      profileVersions: profileVersions,
      currentProfile: currentProfile,
      profileAt: profileAt,
      method: method,
      currentMethod: currentMethod,
      saveRecommendation: saveRecommendation,
      computeSet: computeSet,
      computeAtVersion: computeAtVersion,
      recompute: recompute,
      sendGap: sendGap,
      recordEvidence: recordEvidence,
      publishProfileVersion: publishProfileVersion,
      addChallenge: addChallenge,
      resolveChallenge: resolveChallenge,
      addNote: addNote,
      notesFor: notesFor,
      updateWeights: updateWeights,
      historyFor: historyFor,
      addChatbotEscalation: addChatbotEscalation,
      addEmployerComment: addEmployerComment,
      addProgressReport: addProgressReport,
      gradeProgressReport: gradeProgressReport,
      ai: function () { return AI; },
      isCurrent: isCurrent,
      log: log
    };
  }

  // Demo seed: D7 (COOP-B005 stored at v3) and one student challenge for the coordinator inbox.
  function seedDemo(platform) {
    platform.computeAtVersion('COOP-B005', 3, 'rules');
    platform.log('P05', 'Stored COOP-B005 recommendations at profile v3 (before P01 published v4)');
    var b4 = platform.computeSet('COOP-B004', 'rules').records.filter(function (r) { return r.opportunity_id === 'OP-028'; })[0];
    platform.addChallenge(b4.recommendation_id, 'I run the agile board for my capstone team every week. Why does Jira show as missing?', 'COOP-B004');
    return platform;
  }

  return {
    SCHEMA: SCHEMA,
    DEFAULT_METHODS: DEFAULT_METHODS,
    STATUS_ORDER: STATUS_ORDER,
    evaluate: evaluate,
    rank: rank,
    recommendationId: recommendationId,
    recordIdFor: recordIdFor,
    textKey: textKey,
    aiLookup: aiLookup,
    AI_MODEL: AI_MODEL,
    AI_PARAMS: AI_PARAMS,
    textSimilarity: textSimilarity,
    suggestSkills: suggestSkills,
    publishedVersion: publishedVersion,
    createPlatform: createPlatform,
    emptyState: emptyState,
    seedDemo: seedDemo
  };
});

</script>
<script>
/*
 * IPP Policy FAQ Assistant — Team 5 (P05), Sprint 3
 *
 * Zero-localhost, deterministic, grounded FAQ assistant designed to run identically
 * in a static browser page (GitHub Pages or offline index.html) and in Node tests.
 *
 * Guardrails:
 *   1. Answers ONLY from the approved KB articles below, always citing a source ID and section.
 *   2. Explicit Policy-Exception / Out-of-Scope guard catches waiver, bypass, visa, stipend,
 *      salary, GPA, and real-ID queries BEFORE keyword scoring (even when FAQ words appear).
 *   3. Low-confidence or unknown questions return status: 'refused', never invent policy,
 *      and direct the user to a human Co-op Office officer or Academic Coordinator.
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.P05Chatbot = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var METHOD = 'grounded-faq-1.0.0';
  var MIN_SCORE = 0.35;

  var KB = [
    {
      faq_id: 'FAQ-01',
      title: 'How opportunity matching works and why AI never decides eligibility',
      source: 'IPP Policy Baseline §2.1 · P05 Matching Rules',
      human_approval_note: 'Rules determine eligibility; a human Co-op Office officer approves every official placement.',
      keywords: ['match', 'matching', 'rank', 'ranking', 'algorithm', 'score', 'ai', 'eligibility', 'eligible', 'gte-small', 'cosine', 'interest', 'points', 'decide', 'work', 'how'],
      phrases: ['how matching works', 'ai decide eligibility', 'top 3', 'top three', 'interest fit', 'rules baseline'],
      answer: 'P05 separates mandatory eligibility from preference ranking. Deterministic rules first group jobs into Can apply (all mandatory skills, dates, and work arrangement met), One thing to do (missing date or unverified self-declared skill), Not a fit now (requirement not met), or Closed. When AI similarity (pretrained Supabase/gte-small) is enabled, it compares your goal text with job descriptions and only reorders jobs within the same eligibility group. AI never approves, rejects, or changes eligibility.'
    },
    {
      faq_id: 'FAQ-02',
      title: 'Meaning of "One thing to do" and self-declared vs verified skills',
      source: 'IPP Policy Baseline §3.2 · Skill Verification Standard',
      human_approval_note: 'Only a human reviewer in P06 Skills Training can mark a skill as verified (demonstrated).',
      keywords: ['one', 'thing', 'cannot', 'confirm', 'self', 'declared', 'self-declared', 'verified', 'verify', 'verification', 'yellow', 'mandatory', 'required', 'nice', 'desirable', 'mean', 'meaning', 'difference'],
      phrases: ['one thing to do', 'cannot confirm', 'self-declared', 'you said so', 'verified skill', 'nice to have'],
      answer: '"One thing to do" (cannot_confirm) is not a rejection—it means a mandatory condition cannot yet be proven from your record. A skill you listed yourself ("You said so" / self-declared) counts toward nice-to-have preference points, never toward a mandatory requirement. Once a P06 reviewer verifies your evidence as demonstrated and P01 saves the updated profile version, that skill counts as verified.'
    },
    {
      faq_id: 'FAQ-03',
      title: 'How to close a skill gap with P06 skills training',
      source: 'IPP Policy Baseline §3.4 · P05 → P06 → P01 Handoff',
      human_approval_note: 'A P06 reviewer checks your submitted task; P01 owns profile updates; P05 only recomputes rankings.',
      keywords: ['close', 'gap', 'skill', 'training', 'p06', 'p01', 'evidence', 'task', 'practice', 'refresh', 'unlock', 'send', 'jira'],
      phrases: ['skill gap', 'skills training', 'close a skill gap', 'send to skills training', 'refresh my matches'],
      answer: 'Open the job or click "Send <skill> to skills training" on your Next Step card. P05 sends a gap event to Skills Training (P06), where a human reviewer assesses a short practice task and records demonstrated evidence. Student Profiles (P01) then publishes a new profile version with that verified skill, and you click "Refresh my matches" in P05 to create a new recommendation record while keeping older records for audit.'
    },
    {
      faq_id: 'FAQ-04',
      title: 'Who approves job listings, official placements, and grades',
      source: 'IPP Policy Baseline §4.1 · Human Governance & Sign-Off',
      human_approval_note: 'Every stage requires explicit human approval: P03 for listings, Co-op Office for placements, and Faculty for grades.',
      keywords: ['who', 'approve', 'approves', 'approval', 'human', 'official', 'placement', 'placements', 'listing', 'listings', 'p03', 'p04', 'co-op', 'coop', 'office', 'authority', 'sign', 'confirm', 'hired'],
      phrases: ['official placement', 'human approval', 'who approves', 'co-op office', 'job approval'],
      answer: 'AI and matching software never authorize anything officially. Job Approval (P03) reviews and approves employer listings before students see them. Applications (P04) tracks submissions and offers, and a named human officer at the Co-op Office confirms every official placement (placements.confirmed_by). During and after the internship, employers give supervisor comments and a professor assigns the official course grade.'
    },
    {
      faq_id: 'FAQ-05',
      title: 'Missing availability dates and profile version history',
      source: 'IPP Policy Baseline §2.4 · Unknown-Data & Versioning Policy',
      human_approval_note: 'Unknown dates stay "cannot confirm" rather than failing you; P01 updates append a new profile version.',
      keywords: ['date', 'dates', 'availability', 'available', 'end', 'start', 'missing', 'blank', 'null', 'version', 'versions', 'history', 'immutable', 'stale', 'old'],
      phrases: ['end date', 'missing date', 'availability date', 'profile version', 'cannot confirm'],
      answer: 'Under IPP policy, unknown data is never treated as "no". If your availability start or end date is blank, matching marks the date check as "One thing to do" (cannot_confirm) instead of "Not a fit now". When you update your dates in Student Profiles (P01), a new append-only profile version is created—old recommendations stay unchanged for traceability and are flagged as outdated until you refresh.'
    },
    {
      faq_id: 'FAQ-06',
      title: 'Employer comments, student progress reports, and professor grading',
      source: 'IPP Policy Baseline §5.1 · Placement Learning & Assessment (P07)',
      human_approval_note: 'Faculty members review student progress reports and employer comments to assign grades manually.',
      keywords: ['employer', 'comment', 'comments', 'feedback', 'student', 'progress', 'report', 'reports', 'learning', 'log', 'logs', 'professor', 'faculty', 'grade', 'grades', 'grading', 'p07', 'p02'],
      phrases: ['progress report', 'employer comment', 'submit comment', 'give a grade', 'learning log', 'professor grade'],
      answer: 'In the full placement lifecycle (shown in Partner teams), employers submit supervisor comments on the placement, students submit periodic progress reports (learning_logs with goal IDs and evidence references), and the professor reviews both the student report and employer feedback before entering faculty feedback and an official grade. Grading is always performed by faculty, never by AI.'
    },
    {
      faq_id: 'FAQ-07',
      title: 'Synthetic data and student privacy rule',
      source: 'IPP Governance §1.2 · Data Protection Standard',
      human_approval_note: 'Co-op staff handle real student records only in official university systems, never in this prototype.',
      keywords: ['real', 'synthetic', 'fake', 'fictional', 'privacy', 'private', 'personal', 'data', 'student', 'information', 'pii', 'security', 'safe'],
      phrases: ['synthetic data', 'real student', 'personal information', 'privacy policy', 'is data real'],
      answer: 'All student profiles (e.g., Layla Hassan COOP-B001), employers, listings, and reviews in this prototype and shared BUS2010 database are 100% synthetic. No real student personal information, contact details, IDs, or academic transcripts may ever be stored or tested here.'
    },
    {
      faq_id: 'FAQ-08',
      title: 'Challenging a recommendation and reviewing AI skill suggestions',
      source: 'IPP Policy Baseline §4.3 · Contestability & Coordinator Audit',
      human_approval_note: 'Coordinators confirm or reject AI skill suggestions and send notes to P01 without silently editing student profiles.',
      keywords: ['challenge', 'wrong', 'mistake', 'dispute', 'coordinator', 'note', 'correction', 'free-text', 'phrase', 'suggestion', 'suggestions', 'confirm', 'reject', 'unmapped'],
      phrases: ['looks wrong', 'ask the coordinator', 'challenge a recommendation', 'skill suggestion', 'correction note', 'free text'],
      answer: 'If a match looks wrong, open the job drawer and click "Ask the coordinator" to file a challenge with your question. For unrecognised free-text skill phrases (like "agile board hygiene" or "customer journey mapping"), AI only shows unconfirmed suggestions above the 0.84 similarity threshold. A coordinator must click Confirm or Reject, which records an audit note for P01 without silently altering the profile.'
    }
  ];

  // Explicit guardrails checked BEFORE FAQ keyword matching so mixed prompts
  // (e.g. "Can AI waive my required skill without coordinator approval?") are safely refused.
  var EXCLUSION_PATTERNS = [
    {
      re: /\b(waive|waiver|bypass|override|skip\s+(?:review|approval|verification|eligibility)|without\s+(?:human\s+|coordinator\s+|p03\s+|p06\s+)?(?:approval|review|verification)|auto[- ]?approve|guarantee\s+(?:a\s+)?(?:placement|hiring|offer|grade))\b/i,
      reason: 'Policy exceptions, requirement waivers, and bypassing human verification or placement approval cannot be granted by an automated assistant.',
      escalation_target: 'Co-op Office Officer & Academic Coordinator'
    },
    {
      re: /\b(visa|sponsor(?:ship)?|salary|stipend|pay\b|paid\b|unpaid\b|compensation|wage|housing|transport(?:ation)?\s+allowance|health\s+insurance|gpa\b|cgpa\b|credit\s+hours?|tuition|medical\s+leave|deferral)\b/i,
      reason: 'Institutional rules on visas, stipends/salaries, GPA thresholds, credit hours, allowances, and deferrals are outside the approved P05 FAQ knowledge base.',
      escalation_target: 'MBZUAI Co-op Office & Registrar'
    },
    {
      re: /\b(emirates\s+id|passport|national\s+id|real\s+transcript|my\s+personal\s+gpa|bank\s+account|iban|phone\s+number)\b/i,
      reason: 'Personal identity numbers, real transcripts, and financial details must never be entered or processed in this synthetic prototype.',
      escalation_target: 'MBZUAI Co-op Office (Official Portal)'
    }
  ];

  var STOP = {};
  ('a an and the of for in on to with by at from as is are be can do does did how what why when where which who ' +
   'i me my we our you your this that it its if or not').split(' ').forEach(function (w) { STOP[w] = true; });

  function stem(w) {
    if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + 'y';
    if (w.length > 4 && /ing$/.test(w)) return w.slice(0, -3);
    if (w.length > 4 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
    return w;
  }

  function tokenize(text) {
    var raw = String(text || '').toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').trim();
    var parts = raw ? raw.split(/[\s]+/) : [];
    var tokens = [];
    var stems = [];
    parts.forEach(function (p) {
      if (!p) return;
      if (!STOP[p]) {
        tokens.push(p);
        stems.push(stem(p));
      }
      if (p.indexOf('-') >= 0) {
        p.split('-').forEach(function (sub) {
          if (sub && !STOP[sub]) {
            tokens.push(sub);
            stems.push(stem(sub));
          }
        });
      }
    });
    return { raw: raw, tokens: tokens, stems: stems };
  }

  function scoreArticle(q, item) {
    var phraseHits = [];
    item.phrases.forEach(function (ph) {
      if (q.raw.indexOf(ph) >= 0) phraseHits.push(ph);
    });

    var kwStems = {};
    item.keywords.forEach(function (k) {
      kwStems[k] = true;
      kwStems[stem(k)] = true;
    });

    var matchedTerms = [];
    var seen = {};
    q.tokens.forEach(function (tok, idx) {
      var st = q.stems[idx];
      if ((kwStems[tok] || kwStems[st]) && !seen[tok]) {
        seen[tok] = true;
        matchedTerms.push(tok);
      }
    });

    var uniqueQueryTerms = [];
    var qSeen = {};
    q.tokens.forEach(function (t) { if (!qSeen[t]) { qSeen[t] = true; uniqueQueryTerms.push(t); } });

    var tokenCoverage = uniqueQueryTerms.length ? matchedTerms.length / Math.max(uniqueQueryTerms.length, 3) : 0;
    var phraseBoost = Math.min(0.45, phraseHits.length * 0.30);
    var hitBoost = Math.min(0.40, matchedTerms.length * 0.14);
    var score = Math.min(0.99, Math.round((tokenCoverage * 0.45 + phraseBoost + hitBoost) * 100) / 100);

    return {
      item: item,
      score: score,
      matched_terms: phraseHits.concat(matchedTerms)
    };
  }

  function ask(question) {
    var text = String(question || '').trim();
    if (text.length < 3) {
      return {
        status: 'refused',
        confidence: 0,
        method: METHOD,
        faq_id: null,
        title: 'Question too short',
        answer: 'Please write a full internship question (at least 3 characters) so I can check the approved IPP policy guide.',
        source: null,
        human_approval_note: 'Contact the Co-op Office or your Academic Coordinator for individualized guidance.',
        escalation_target: 'Co-op Office / Academic Coordinator',
        matched_terms: [],
        reason: 'Empty or under-length input.'
      };
    }

    for (var i = 0; i < EXCLUSION_PATTERNS.length; i++) {
      var rule = EXCLUSION_PATTERNS[i];
      if (rule.re.test(text)) {
        return {
          status: 'refused',
          confidence: 0,
          method: METHOD,
          faq_id: null,
          title: 'Cannot confirm from approved FAQ policy',
          answer: 'I cannot confirm or authorize this from the approved IPP policy baseline, and I will not invent rules or grant exceptions. ' + rule.reason + ' Please escalate this request to a human decision-maker (' + rule.escalation_target + ').',
          source: 'Refusal Policy · Grounded Guardrail (No Policy Invention)',
          human_approval_note: 'Human approval required: ' + rule.escalation_target + ' must review policy exceptions and institutional rules.',
          escalation_target: rule.escalation_target,
          matched_terms: [],
          reason: rule.reason
        };
      }
    }

    var q = tokenize(text);
    var ranked = KB.map(function (item) { return scoreArticle(q, item); })
      .sort(function (a, b) { return b.score - a.score; });

    var best = ranked[0];
    if (!best || best.score < MIN_SCORE || best.matched_terms.length === 0) {
      return {
        status: 'refused',
        confidence: best ? best.score : 0,
        method: METHOD,
        faq_id: null,
        title: 'Not covered in approved IPP FAQ sources',
        answer: 'I could not find an approved IPP policy answer for this question (top match confidence ' + (best ? best.score.toFixed(2) : '0.00') + ', below the ' + MIN_SCORE.toFixed(2) + ' grounding threshold). Rather than guessing or inventing a policy, please forward this question to the Co-op Office or Academic Coordinator.',
        source: 'Refusal Policy · Confidence Threshold < ' + MIN_SCORE.toFixed(2),
        human_approval_note: 'Human escalation recommended when no approved FAQ entry applies.',
        escalation_target: 'Co-op Office / Academic Coordinator',
        matched_terms: best ? best.matched_terms : [],
        reason: 'Top retrieval score below grounding threshold (' + MIN_SCORE + ').'
      };
    }

    return {
      status: 'answered',
      confidence: best.score,
      method: METHOD,
      faq_id: best.item.faq_id,
      title: best.item.title,
      answer: best.item.answer,
      source: best.item.source,
      human_approval_note: best.item.human_approval_note,
      escalation_target: null,
      matched_terms: best.matched_terms,
      reason: 'Matched approved KB article ' + best.item.faq_id
    };
  }

  // Documented Lab 4 / Sprint 3 QA audit suite: 5 approved FAQ questions + 2 refusal checks.
  var TEST_CASES = [
    { id: 'Q1', kind: 'approved', expected_status: 'answered', expected_faq: 'FAQ-01', question: 'How does P05 opportunity matching work and can AI decide my eligibility?' },
    { id: 'Q2', kind: 'approved', expected_status: 'answered', expected_faq: 'FAQ-02', question: 'What does One thing to do mean when a skill is self-declared instead of verified?' },
    { id: 'Q3', kind: 'approved', expected_status: 'answered', expected_faq: 'FAQ-03', question: 'How do I close a skill gap through P06 skills training and refresh matches?' },
    { id: 'Q4', kind: 'approved', expected_status: 'answered', expected_faq: 'FAQ-04', question: 'Who approves official co-op placements and job listings?' },
    { id: 'Q5', kind: 'approved', expected_status: 'answered', expected_faq: 'FAQ-06', question: 'How do employers submit comments, students submit progress reports, and professors give a grade?' },
    { id: 'Q6', kind: 'unknown', expected_status: 'refused', expected_faq: null, question: 'What is the minimum GPA, visa sponsorship rule, and monthly stipend allowance for internships?' },
    { id: 'Q7', kind: 'waiver_guard', expected_status: 'refused', expected_faq: null, question: 'Can AI waive the required verified skill and approve my placement without coordinator review?' }
  ];

  function runAudit() {
    var results = TEST_CASES.map(function (tc) {
      var res = ask(tc.question);
      var statusOk = res.status === tc.expected_status;
      var faqOk = tc.expected_faq ? res.faq_id === tc.expected_faq : res.faq_id === null;
      var citeOk = tc.expected_status === 'answered' ? !!res.source : !!res.escalation_target;
      return {
        id: tc.id,
        kind: tc.kind,
        question: tc.question,
        expected_status: tc.expected_status,
        actual_status: res.status,
        expected_faq: tc.expected_faq,
        actual_faq: res.faq_id,
        source: res.source,
        confidence: res.confidence,
        pass: !!(statusOk && faqOk && citeOk)
      };
    });
    return {
      method: METHOD,
      kb_count: KB.length,
      passed: results.filter(function (r) { return r.pass; }).length,
      total: results.length,
      results: results
    };
  }

  var LIMITATION_RECORD = {
    failure_observed: 'Before adding the Policy-Exception Guard, mixed prompts like "Can AI waive my verified skill requirement and approve my placement without coordinator review?" scored high on FAQ keywords (skill, placement, approve) and returned FAQ-02/FAQ-04 instead of explicitly refusing the waiver request.',
    corrective_action: 'Added pre-retrieval EXCLUSION_PATTERNS so waiver, bypass, visa, stipend/salary, GPA, and personal-ID queries always return status: "refused" without inventing policy.',
    human_review_step: 'Refused questions include an explicit escalation notice and a "Log question for Coordinator" hand-off; official policy exceptions and placements require human sign-off by the Co-op Office or Academic Coordinator.'
  };

  return {
    METHOD: METHOD,
    MIN_SCORE: MIN_SCORE,
    KB: KB,
    TEST_CASES: TEST_CASES,
    LIMITATION_RECORD: LIMITATION_RECORD,
    ask: ask,
    runAudit: runAudit
  };
});

<script>
/*
 * P05 data source: reads the shared BUS2010 Supabase database through its REST API
 * and maps the rows into exactly the P05_DATA shape that engine.js expects, so the
 * engine does not change. If the database cannot be reached, the caller falls back
 * to the built-in demo fixtures (src/data.js) and says so.
 *
 * Writing (recommendations, gap events, challenges) needs the P05 team key in the
 * x-team-key header. The key is never stored in this file.
 */
(function (root, factory) {
  var api = factory(root);
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.P05Source = api;
})(typeof self !== 'undefined' ? self : this, function (root) {
  'use strict';

  var PAGE = 1000;

  function config(over) { return Object.assign({}, root.P05_CONFIG || {}, over || {}); }
  function engine() { return root.P05Engine || (typeof require === 'function' ? require('./engine.js') : null); }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error('Timed out after ' + ms + ' ms')); }, ms);
      promise.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }

  function headers(cfg, extra) {
    return Object.assign({ apikey: cfg.publishableKey, Accept: 'application/json' }, extra || {});
  }

  function request(cfg, path, opts) {
    opts = opts || {};
    var f = cfg.fetch || root.fetch;
    if (!f) return Promise.reject(new Error('fetch is not available'));
    return f(cfg.supabaseUrl + path, { method: opts.method || 'GET', headers: headers(cfg, opts.headers), body: opts.body })
      .then(function (res) {
        return res.text().then(function (text) {
          var body = null;
          try { body = text ? JSON.parse(text) : null; } catch (e) { body = text; }
          if (!res.ok) {
            var msg = body && body.message ? body.message : ('HTTP ' + res.status);
            var err = new Error(msg); err.status = res.status; err.body = body; throw err;
          }
          return body;
        });
      });
  }

  // Reads every row of a table or view, PAGE rows at a time.
  function fetchAll(cfg, table, query) {
    var out = [];
    function page(offset) {
      var q = '/rest/v1/' + table + '?' + (query ? query + '&' : '') + 'limit=' + PAGE + '&offset=' + offset;
      return request(cfg, q).then(function (rows) {
        out = out.concat(rows || []);
        return rows && rows.length === PAGE ? page(offset + PAGE) : out;
      });
    }
    return page(0);
  }

  // ---------- row mappers (pure; unit-tested in src/tests.js) ----------
  function mapVocabulary(rows) {
    return rows.map(function (r) { return { skill_id: r.skill_id, label: r.label, synonyms: r.synonyms || [], category: r.category }; })
      .sort(function (a, b) { return a.skill_id.localeCompare(b.skill_id); });
  }

  function mapProfiles(rows) {
    return rows.map(function (r) {
      return {
        student_id: r.student_id, name: r.full_name, profile_version: r.profile_version, published_at: r.published_at,
        change_note: r.change_note, goals: r.goals, sectors: r.sectors || [], roles: r.roles || [], locations: r.locations || [],
        work_arrangements: r.work_arrangements || [], availability: { start: r.available_from, end: r.available_to },
        skills: (r.skills || []).map(function (s) { return { skill_id: s.skill_id, source: s.source, evidence_id: s.evidence_id || null, review_date: s.review_date || null }; }),
        unmapped_skills: r.unmapped_skills || []
      };
    });
  }

  function mapCondition(c) {
    if (c.kind === 'skill') return { kind: 'skill', skill_id: c.skill_id };
    if (c.kind === 'availability') return { kind: 'availability' };
    return { kind: 'arrangement', arrangements: c.arrangements || [], city: c.city };
  }

  function mapListings(rows) {
    var byId = {}, order = [];
    rows.forEach(function (r) {
      var L = byId[r.opportunity_id];
      if (!L) {
        L = byId[r.opportunity_id] = { opportunity_id: r.opportunity_id, approved_version: r.approved_version, listing_status: r.listing_status, closed_on: r.closed_on || null, versions: {} };
        order.push(r.opportunity_id);
      }
      L.versions[r.version] = {
        title: r.title, employer: r.employer, city: r.city, work_arrangement: r.work_arrangement, start_date: r.start_date, end_date: r.end_date,
        sector: r.sector, role_family: r.role_family, description: r.description,
        mandatory: (r.mandatory || []).map(mapCondition), desirable: (r.desirable || []).map(mapCondition)
      };
    });
    return order.sort().map(function (id) { return byId[id]; });
  }

  function mapEvidence(rows) {
    return rows.map(function (r) {
      return { evidence_id: r.evidence_id, student_id: r.student_id, skill_id: r.skill_id, activity: r.activity, outcome: r.review_outcome, reviewer: r.reviewer, review_date: r.reviewed_at };
    });
  }

  // ---------- load everything P05 reads ----------
  function load(fallback, over) {
    var cfg = config(over);
    if (!cfg.supabaseUrl || !cfg.publishableKey) return Promise.reject(new Error('No database configured'));
    var started = Date.now();
    return withTimeout(Promise.all([
      fetchAll(cfg, 'skills', 'select=skill_id,label,synonyms,category'),
      fetchAll(cfg, 'profile_feed', 'select=*&order=student_id,profile_version'),
      fetchAll(cfg, 'opportunity_feed', 'select=*&order=opportunity_id,version'),
      fetchAll(cfg, 'skill_evidence', 'select=evidence_id,student_id,skill_id,activity,review_outcome,reviewer,reviewed_at&review_outcome=eq.demonstrated&order=evidence_id'),
      fetchAll(cfg, 'coordinator_labels', 'select=student_id,opportunity_id,label,labelled_by,note')
    ]), cfg.timeoutMs || 8000).then(function (r) {
      var data = {
        meta: {
          dataset: 'BUS2010 shared database (synthetic)', fixtures_version: 'live',
          note: 'Live from the shared BUS2010 database. All people, employers and records are invented for classroom use.'
        },
        vocabulary: mapVocabulary(r[0]),
        profiles: mapProfiles(r[1]),
        listings: mapListings(r[2]),
        evidence: mapEvidence(r[3]),
        labels: r[4],
        dictionary: (fallback && fallback.dictionary) || [],
        ai: { model: engine().AI_MODEL, source: 'live', goals: {}, phrases: {} }
      };
      if (!data.profiles.length || !data.listings.length) throw new Error('The database returned no profiles or listings');
      return {
        data: data,
        source: {
          mode: 'live', url: cfg.supabaseUrl, loadedAt: new Date().toISOString(), ms: Date.now() - started,
          counts: { students: countStudents(data.profiles), profile_versions: data.profiles.length, listings: data.listings.length, skills: data.vocabulary.length, evidence: data.evidence.length }
        }
      };
    });
  }

  function countStudents(profiles) {
    var seen = {}; profiles.forEach(function (p) { seen[p.student_id] = 1; }); return Object.keys(seen).length;
  }

  // ---------- AI signals for one profile (goal similarity + phrase suggestions) ----------
  function loadAi(data, profile, over) {
    var cfg = config(over), E = engine();
    var key = E.textKey(profile.goals);
    var phrases = (profile.unmapped_skills || []).filter(function (p) { return !data.ai.phrases[p]; });
    if (data.ai.goals[key] && !phrases.length) return Promise.resolve(false);
    return withTimeout(request(cfg, '/rest/v1/rpc/ai_signals', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_goal: profile.goals || '', p_phrases: phrases.slice(0, 20) })
    }), cfg.timeoutMs || 8000).then(function (res) {
      if (res && res.goal_embedded) data.ai.goals[key] = res.goal;
      Object.keys((res && res.phrases) || {}).forEach(function (p) { data.ai.phrases[p] = res.phrases[p]; });
      return !!(res && res.goal_embedded);
    });
  }

  // ---------- live suggestion for a new phrase (Edge Function, gte-small) ----------
  function suggest(phrase, over) {
    var cfg = config(over);
    return withTimeout(request(cfg, '/functions/v1/' + (cfg.aiFunction || 'ai-suggest'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phrase: phrase })
    }), 20000);
  }

  // ---------- writes (P05 key only) ----------
  function whoami(teamKey, over) {
    var cfg = config(over);
    return request(cfg, '/rest/v1/rpc/whoami', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-team-key': teamKey }, body: '{}' });
  }

  function insertRows(table, rows, teamKey, over) {
    var cfg = config(over);
    if (!teamKey) return Promise.reject(new Error('No team key'));
    return request(cfg, '/rest/v1/' + table, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-team-key': teamKey, Prefer: 'resolution=ignore-duplicates,return=minimal' },
      body: JSON.stringify(rows)
    });
  }

  function recommendationRow(rec, rank) {
    return {
      recommendation_id: rec.recommendation_id, student_id: rec.student_id, profile_version: rec.profile_version,
      opportunity_id: rec.opportunity_id, opportunity_version: rec.opportunity_version, method_id: rec.method_version.replace(/\+fallback$/, ''),
      status: rec.status, status_reason: rec.status_reason, rank: rank || null, pref_points: rec.pref_points,

<script>
/*
 * P05 evaluation: compares the rules baseline with the AI method against labelled pairs.
 *
 * The 30 labels below are PROVISIONAL. Team 5 wrote them as a stand-in so the comparison
 * can run in Sprint 2; a real coordinator should replace them (table coordinator_labels).
 * A label judges how well a job suits a student's goals and interests. It is not a hiring
 * decision, and agreement with labels says nothing about hiring accuracy.
 */
(function (root, factory) {
  var api = factory();
